<head>

  <title>Simulateur Crédit Immobilier</title>

  <style>
    :root {
      --sidebar-bg: #1e293b;
      --sidebar-text: #e2e8f0;
      --sidebar-muted: #94a3b8;
      --sidebar-input-bg: #334155;
      --content-bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --blue: #2563eb;
      --red: #dc2626;
      --green: #10b981;
      --amber: #f59e0b;
      --text: #1e293b;
      --text-muted: #64748b;
      --font: system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--content-bg); color: var(--text); }
    .app { display: flex; min-height: 100vh; }

    /* ---- SIDEBAR ---- */
    .sidebar {
      width: 240px; min-width: 240px;
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      padding: 16px 12px;
      display: flex; flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-group { margin-bottom: 18px; }
    .sidebar-group-title {
      font-size: 10px; font-weight: 700;
      letter-spacing: .1em; color: var(--sidebar-muted);
      text-transform: uppercase; margin-bottom: 10px;
    }
    .sidebar-field { margin-bottom: 8px; }
    .sidebar-field label { display: block; font-size: 11px; color: #cbd5e1; margin-bottom: 3px; }
    .sidebar-field input,
    .sidebar-field select {
      width: 100%;
      background: var(--sidebar-input-bg);
      border: 1px solid #475569; border-radius: 5px;
      color: var(--sidebar-text); font-size: 12px;
      padding: 5px 8px; outline: none;
      transition: border-color .15s;
    }
    .sidebar-field input:focus,
    .sidebar-field select:focus { border-color: var(--blue); }
    .sidebar-field select option { background: var(--sidebar-bg); }
    .sidebar-footer { margin-top: auto; padding-top: 16px; }
    .btn-scenario {
      width: 100%; background: var(--blue); color: white;
      border: none; border-radius: 6px; padding: 8px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: background .15s;
    }
    .btn-scenario:hover { background: #1d4ed8; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }

    /* ---- MAIN CONTENT ---- */
    .content {
      flex: 1; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
      overflow-x: hidden;
    }

    /* ---- KPIs ---- */
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .kpi-card {
      background: var(--card-bg); border-radius: 10px;
      padding: 12px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .kpi-label { font-size: 10px; font-weight: 700; color: var(--text-muted); letter-spacing: .06em; text-transform: uppercase; }
    .kpi-value { font-size: 20px; font-weight: 700; color: var(--text); margin: 4px 0 2px; }
    .kpi-value--green { color: var(--green); }
    .kpi-value--red { color: var(--red); }
    .kpi-sub { font-size: 11px; color: var(--text-muted); }

    /* ---- CARDS & CHARTS ---- */
    .card {
      background: var(--card-bg); border-radius: 10px;
      padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .card-header {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 12px;
    }
    .card-title { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .charts-row { display: grid; grid-template-columns: 2fr 1.5fr 1fr; gap: 12px; }
    .chart-card canvas { max-height: 220px; }

    /* ---- TOGGLE BUTTONS ---- */
    .toggle-group { display: flex; gap: 4px; }
    .toggle-btn {
      font-size: 11px; padding: 3px 10px;
      border: 1px solid var(--border); border-radius: 5px;
      background: transparent; color: var(--text-muted);
      cursor: pointer; transition: all .15s;
    }
    .toggle-btn.active { background: var(--blue); border-color: var(--blue); color: white; }

    /* ---- TABLEAU ---- */
    .tableau-wrapper { overflow-x: auto; max-height: 320px; overflow-y: auto; }
    .tableau-wrapper table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .tableau-wrapper th {
      position: sticky; top: 0;
      background: #f1f5f9; padding: 6px 8px;
      text-align: right; color: var(--text-muted);
      font-weight: 600; font-size: 10px;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .tableau-wrapper th:first-child { text-align: left; }
    .tableau-wrapper td { padding: 4px 8px; text-align: right; border-bottom: 1px solid #f1f5f9; }
    .tableau-wrapper td:first-child { text-align: left; }
    .tableau-wrapper tr:nth-child(even) td { background: #fafafa; }
    .col-capital { color: var(--blue); }
    .col-interets { color: var(--red); }
    .col-assurance { color: var(--amber); }
    .col-valeur { color: var(--green); }

    /* ---- COMPARAISON ---- */
    .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; grid-column: 1 / -1; }
    .scenario-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
    .scenario-a-label { color: var(--blue); }
    .scenario-b-label { color: var(--amber); }

    /* ---- RESPONSIVE ---- */
    @media (max-width: 900px) {
      .app { flex-direction: column; }
      .sidebar { width: 100%; min-width: 0; }
      .kpis { grid-template-columns: repeat(2, 1fr); }
      .charts-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="content">

      <div class="charts-row">

            <button id="btn-t-an" class="toggle-btn" onclick="toggleTableauMode('annee')">Par année</button>

  <!-- ==================== MOTEUR DE CALCUL ==================== -->
  <script>
  // ==================== MOTEUR DE CALCUL ====================

  function calcMensualite(capital, tauxAnnuel, dureeAns) {
    if (tauxAnnuel === 0) return capital / (dureeAns * 12);
    const t = tauxAnnuel / 12 / 100;
    const n = dureeAns * 12;
    return capital * t / (1 - Math.pow(1 + t, -n));
  }

  function calcAmortissement(p) {
    const { capital, tauxNominal, duree, tauxAssurance,
            differeMois, differeType,
            ptzMontant, ptzDuree, ptzDiffere,
            valeurBien, tauxApprec } = p;

    const t = tauxNominal / 12 / 100;
    const n = duree * 12;
    const assuranceMensuelle = capital * tauxAssurance / 12 / 100;

    // Capital effectif après différé total (intérêts capitalisés)
    const capitalApresDiffere = differeType === 'total'
      ? capital * Math.pow(1 + t, differeMois)
      : capital;

    const dureeEffective = n - differeMois;
    const mensualite = tauxNominal === 0
      ? capitalApresDiffere / dureeEffective
      : capitalApresDiffere * t / (1 - Math.pow(1 + t, -dureeEffective));

    // PTZ: mensualité fixe sans intérêts, après différé PTZ
    const ptzN = ptzDuree * 12 - ptzDiffere;
    const ptzMensualite = ptzMontant > 0 && ptzN > 0 ? ptzMontant / ptzN : 0;

    const rows = [];
    let capitalRestant = capital;
    let ptzRestant = ptzMontant;

    for (let mois = 1; mois <= n; mois++) {
      const enDiffere = mois <= differeMois;
      const enDifferePTZ = mois <= ptzDiffere;

      const interets = capitalRestant * t;
      let capitalRembourse = 0;

      if (enDiffere) {
        if (differeType === 'total') {
          // Intérêts capitalisés — pas de paiement
          capitalRestant = capitalRestant * (1 + t);
        }
        // différé partiel : intérêts seuls payés, capital ne bouge pas
      } else {
        capitalRembourse = mensualite - interets;
        capitalRestant = Math.max(0, capitalRestant - capitalRembourse);
      }

      const ptzPaiement = !enDifferePTZ && ptzRestant > 0
        ? Math.min(ptzMensualite, ptzRestant) : 0;
      ptzRestant = Math.max(0, ptzRestant - ptzPaiement);

      const valeurBienMois = valeurBien * Math.pow(1 + tauxApprec / 100, mois / 12);

      const mensualiteLigne = enDiffere
        ? (differeType === 'partiel' ? interets + assuranceMensuelle : assuranceMensuelle)
        : mensualite + assuranceMensuelle + ptzPaiement;

      rows.push({
        mois,
        annee: Math.ceil(mois / 12),
        mensualite: mensualiteLigne,
        capital: enDiffere ? 0 : capitalRembourse,
        interets,
        assurance: assuranceMensuelle,
        ptz: ptzPaiement,
        capitalRestant,
        valeurBien: valeurBienMois
      });
    }
    return rows;
  }

  function calcTAEG(capitalNet, rows) {
    // Bisection: trouver le taux mensuel r tel que capitalNet = Σ flux_i / (1+r)^i
    const flux = rows.map(r => r.mensualite);
    let lo = 0, hi = 1;
    for (let iter = 0; iter < 100; iter++) {
      const mid = (lo + hi) / 2;
      const pv = flux.reduce((s, f, i) => s + f / Math.pow(1 + mid, i + 1), 0);
      if (pv > capitalNet) lo = mid; else hi = mid;
    }
    const rMensuel = (lo + hi) / 2;
    return Math.round((Math.pow(1 + rMensuel, 12) - 1) * 10000) / 100;
  }

  function calcSimulation(p) {
    const rows = calcAmortissement(p);
    if (!rows.length) return null;

    const interetsTotaux = rows.reduce((s, r) => s + r.interets, 0);
    const assuranceTotale = rows.reduce((s, r) => s + r.assurance, 0);
    const fraisNotaire = p.valeurBien * p.fraisNotairePct / 100;
    const coutCredit = interetsTotaux + assuranceTotale;
    const coutTotalOperation = p.capital + interetsTotaux + assuranceTotale
      + fraisNotaire + p.fraisDossier + p.fraisGarantie - p.apport;

    // Mensualité post-différé (première ligne hors période de différé)
    const postDiffereRow = rows[p.differeMois] || rows[0];
    const mensualite = postDiffereRow.mensualite;
    const mensualiteAssurance = p.capital * p.tauxAssurance / 12 / 100;

    const valeurBienTerme = p.valeurBien * Math.pow(1 + p.tauxApprec / 100, p.duree);
    const plusValueNette = valeurBienTerme - coutTotalOperation;

    const capitalNetTAEG = p.capital - p.fraisDossier - p.fraisGarantie;
    const taeg = calcTAEG(Math.max(capitalNetTAEG, 1), rows);

    // Données graphique principal (mensuel)
    const capitalRestantParMois = rows.map(r => Math.round(r.capitalRestant));
    const valeurBienParMois = rows.map(r => Math.round(r.valeurBien));
    const labelsParMois = rows.map((_, i) => (i % 12 === 0) ? `An ${Math.floor(i / 12) + 1}` : '');

    // Point de croisement
    let moisCroisement = null;
    for (let i = 0; i < rows.length; i++) {
      if (rows[i].valeurBien >= rows[i].capitalRestant) { moisCroisement = i + 1; break; }
    }

    // Données graphique secondaire (annuel)
    const labelsAns = [];
    const capitalParAn = [], interetsParAn = [];
    const capitalCumule = [], interetsCumules = [];
    let cumCap = 0, cumInt = 0;
    for (let an = 1; an <= p.duree; an++) {
      labelsAns.push(`An ${an}`);
      const anRows = rows.filter(r => r.annee === an);
      const capAn = anRows.reduce((s, r) => s + r.capital, 0);
      const intAn = anRows.reduce((s, r) => s + r.interets, 0);
      capitalParAn.push(Math.round(capAn));
      interetsParAn.push(Math.round(intAn));
      cumCap += capAn; cumInt += intAn;
      capitalCumule.push(Math.round(cumCap));
      interetsCumules.push(Math.round(cumInt));
    }

    return {
      mensualite: Math.round(mensualite),
      mensualiteAssurance: Math.round(mensualiteAssurance),
      interetsTotaux: Math.round(interetsTotaux),
      assuranceTotale: Math.round(assuranceTotale),
      fraisNotaire: Math.round(fraisNotaire),
      coutCredit: Math.round(coutCredit),
      coutTotalOperation: Math.round(coutTotalOperation),
      valeurBienTerme: Math.round(valeurBienTerme),
      plusValueNette: Math.round(plusValueNette),
      taeg,
      amortissement: rows,
      labelsParMois,
      capitalRestantParMois,
      valeurBienParMois,
      moisCroisement,
      labelsAns,
      capitalParAn,
      interetsParAn,
      capitalCumule,
      interetsCumules
    };
  }

  // ---- TESTS ----
  function _runTests() {
    // calcMensualite: 250 000€ @ 3.7% sur 20 ans ≈ 1 476€
    const m = calcMensualite(250000, 3.7, 20);
    console.assert(m !== null && Math.abs(m - 1476) < 5, `calcMensualite failed: got ${m}`);

    // calcAmortissement: premier mois, intérêts = 120000 * 3.6/12/100 = 360
    const rows = calcAmortissement({
      capital: 120000, tauxNominal: 3.6, duree: 10,
      tauxAssurance: 0, differeMois: 0, differeType: 'partiel',
      ptzMontant: 0, ptzDuree: 0, ptzDiffere: 0,
      valeurBien: 150000, tauxApprec: 2
    });
    console.assert(rows.length === 120, `rows.length: got ${rows.length}, want 120`);
    console.assert(Math.abs(rows[0].interets - 360) < 1, `row[0].interets: got ${rows[0].interets}, want 360`);
    console.assert(rows[0].capitalRestant < 120000, `capitalRestant should decrease`);
    console.assert(rows[119].capitalRestant < 1, `last row capitalRestant should be ~0: got ${rows[119].capitalRestant}`);

    // calcSimulation: test agrégats basiques
    const res = calcSimulation({
      capital: 200000, tauxNominal: 3.6, duree: 15,
      tauxAssurance: 0.3, apport: 30000,
      fraisNotairePct: 7.5, fraisDossier: 1000, fraisGarantie: 1500,
      differeMois: 0, differeType: 'partiel',
      ptzMontant: 0, ptzDuree: 0, ptzDiffere: 0,
      valeurBien: 230000, tauxApprec: 2
    });
    console.assert(res !== null, 'calcSimulation returned null');
    console.assert(res.mensualite > 0, `mensualite should be > 0: got ${res?.mensualite}`);
    console.assert(res.amortissement.length === 180, `should be 180 rows: got ${res?.amortissement?.length}`);
    console.assert(res.valeurBienTerme > 230000, `valeurBienTerme should grow: got ${res?.valeurBienTerme}`);
    console.assert(res.taeg > 0, `TAEG should be > 0: got ${res?.taeg}`);

    console.log('[Tests Task 3] Terminés — vérifier les assertions ci-dessus');
  }
  _runTests();
  </script>

  <!-- ==================== INTERFACE & RENDU ==================== -->
  <script>
  // ==================== INTERFACE & RENDU ====================

  let chartPrincipal = null;
  let chartSecondaire = null;
  let chartDonut = null;
  let modeGraphique = 'A';
  let modeTableau = 'mois';
  let scenarioBActif = false;

  function lireParams(prefix) {
    const v = id => parseFloat(document.getElementById(`${prefix}-${id}`)?.value) || 0;
    const s = id => document.getElementById(`${prefix}-${id}`)?.value || 'partiel';
    return {
      capital:        v('capital'),
      tauxNominal:    v('taux'),
      duree:          v('duree') || 1,
      tauxAssurance:  v('assurance'),
      apport:         v('apport'),
      fraisNotairePct: v('notaire'),
      fraisDossier:   v('dossier'),
      fraisGarantie:  v('garantie'),
      differeMois:    v('differe-mois'),
      differeType:    s('differe-type'),
      ptzMontant:     v('ptz-montant'),
      ptzDuree:       v('ptz-duree'),
      ptzDiffere:     v('ptz-differe'),
      valeurBien:     v('valeur-bien') || 1,
      tauxApprec:     v('apprec')
    };
  }

  function fmt(n) {
    return new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 }).format(Math.round(n)) + ' €';
  }
  function fmtPct(n) { return (+n).toFixed(2) + ' %'; }

  function _kpiHTML(res, prefix) {
    const pvClass = res.plusValueNette >= 0 ? 'kpi-value--green' : 'kpi-value--red';
    const duree = parseFloat(document.getElementById(`${prefix}-duree`)?.value) || 20;
    const tauxApprec = parseFloat(document.getElementById(`${prefix}-apprec`)?.value) || 0;
    return `
      <div class="kpi-card">
        <div class="kpi-label">Mensualité</div>
        <div class="kpi-value">${fmt(res.mensualite)}</div>
        <div class="kpi-sub">dont assurance : ${fmt(res.mensualiteAssurance)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Coût crédit</div>
        <div class="kpi-value kpi-value--red">${fmt(res.coutCredit)}</div>
        <div class="kpi-sub">intérêts + assurance</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Valeur estimée</div>
        <div class="kpi-value kpi-value--green">${fmt(res.valeurBienTerme)}</div>
        <div class="kpi-sub">dans ${duree} ans à ${fmtPct(tauxApprec)}/an</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Plus-value nette</div>
        <div class="kpi-value ${pvClass}">${res.plusValueNette >= 0 ? '+' : ''}${fmt(res.plusValueNette)}</div>
        <div class="kpi-sub">valeur − coût total op.</div>
      </div>`;
  }

  function renderKPIs(res) {
    document.getElementById('kpis').innerHTML = `<div class="kpis">${_kpiHTML(res, 'a')}</div>`;
  }

  function onInput() {
    const pA = lireParams('a');
    if (pA.capital <= 0 || pA.duree < 1) return;
    const resA = calcSimulation(pA);
    if (!resA) return;

    if (scenarioBActif) {
      const pB = lireParams('b');
      if (pB.capital <= 0 || pB.duree < 1) return;
      const resB = calcSimulation(pB);
      if (!resB) return;
      document.getElementById('kpis').innerHTML = `
        <div class="comparison-grid">
          <div>
            <div class="scenario-label scenario-a-label">Scénario A</div>
            <div class="kpis">${_kpiHTML(resA, 'a')}</div>
          </div>
          <div>
            <div class="scenario-label scenario-b-label">Scénario B</div>
            <div class="kpis">${_kpiHTML(resB, 'b')}</div>
          </div>
        </div>`;
      renderGraphiquePrincipal(resA, resB);
      renderGraphiqueSecondaire(resA);
      renderDonut(resA);
      renderTableau(resA.amortissement, pA.duree);
    } else {
      renderKPIs(resA);
      renderGraphiquePrincipal(resA, null);
      renderGraphiqueSecondaire(resA);
      renderDonut(resA);
      renderTableau(resA.amortissement, pA.duree);
    }
  }

  // Stubs — replaced in Tasks 7–11
  function renderGraphiquePrincipal(res, resB) {
    const ctx = document.getElementById('chart-principal').getContext('2d');

    const datasets = [
      {
        label: 'Capital restant dû' + (resB ? ' — A' : ''),
        data: res.capitalRestantParMois,
        borderColor: '#2563eb',
        backgroundColor: 'rgba(37,99,235,0.07)',
        fill: true, tension: 0.3, borderWidth: 2, pointRadius: 0
      },
      {
        label: 'Valeur du bien' + (resB ? ' — A' : ''),
        data: res.valeurBienParMois,
        borderColor: '#10b981',
        borderDash: [6, 3],
        fill: false, tension: 0.3, borderWidth: 2, pointRadius: 0
      }
    ];

    if (resB) {
      datasets.push({
        label: 'Capital restant dû — B',
        data: resB.capitalRestantParMois,
        borderColor: '#f59e0b',
        borderDash: [4, 2],
        fill: false, tension: 0.3, borderWidth: 2, pointRadius: 0
      });
      datasets.push({
        label: 'Valeur du bien — B',
        data: resB.valeurBienParMois,
        borderColor: '#6366f1',
        borderDash: [6, 3],
        fill: false, tension: 0.3, borderWidth: 2, pointRadius: 0
      });
    }

    const data = { labels: res.labelsParMois, datasets };

    const options = {
      responsive: true, maintainAspectRatio: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            label: c => ` ${c.dataset.label} : ${new Intl.NumberFormat('fr-FR').format(c.parsed.y)} €`
          }
        }
      },
      scales: {
        x: { ticks: { maxTicksLimit: 10, font: { size: 10 } }, grid: { display: false } },
        y: {
          ticks: {
            font: { size: 10 },
            callback: v => new Intl.NumberFormat('fr-FR', { notation: 'compact' }).format(v) + ' €'
          }
        }
      }
    };

    if (!chartPrincipal) {
      chartPrincipal = new Chart(ctx, { type: 'line', data, options });
    } else {
      chartPrincipal.data = data;
      chartPrincipal.update();
    }

    // Annotation croisement dans le titre
    const titleEl = document.getElementById('title-principal');
    if (titleEl) {
      const cross = res.moisCroisement
        ? ` — Croisement : An ${Math.ceil(res.moisCroisement / 12)}, mois ${res.moisCroisement}`
        : '';
      titleEl.textContent = 'Capital restant dû vs Valeur du bien' + cross;
    }
  }
  function renderGraphiqueSecondaire(res) {
  const ctx = document.getElementById('chart-secondaire').getContext('2d');
  const newType = modeGraphique === 'A' ? 'bar' : 'line';

  let data;
  if (modeGraphique === 'A') {
    data = {
      labels: res.labelsAns,
      datasets: [
        {
          label: 'Capital remboursé',
          data: res.capitalParAn,
          backgroundColor: 'rgba(37,99,235,0.8)',
          stack: 'stack'
        },
        {
          label: 'Intérêts payés',
          data: res.interetsParAn,
          backgroundColor: 'rgba(220,38,38,0.7)',
          stack: 'stack'
        }
      ]
    };
  } else {
    data = {
      labels: res.labelsAns,
      datasets: [
        {
          label: 'Capital cumulé',
          data: res.capitalCumule,
          borderColor: '#2563eb',
          backgroundColor: 'rgba(37,99,235,0.12)',
          fill: true, tension: 0.3, borderWidth: 2, pointRadius: 0
        },
        {
          label: 'Intérêts cumulés',
          data: res.interetsCumules,
          borderColor: '#dc2626',
          backgroundColor: 'rgba(220,38,38,0.08)',
          fill: true, tension: 0.3, borderWidth: 2, pointRadius: 0
        }
      ]
    };
  }

  const options = {
    responsive: true, maintainAspectRatio: true,
    plugins: {
      legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },
      tooltip: {
        callbacks: {
          label: c => ` ${c.dataset.label} : ${new Intl.NumberFormat('fr-FR').format(c.parsed.y)} €`
        }
      }
    },
    scales: {
      x: { stacked: modeGraphique === 'A', ticks: { font: { size: 10 } }, grid: { display: false } },
      y: {
        stacked: modeGraphique === 'A',
        ticks: {
          font: { size: 10 },
          callback: v => new Intl.NumberFormat('fr-FR', { notation: 'compact' }).format(v) + ' €'
        }
      }
    }
  };

  if (!chartSecondaire || chartSecondaire.config.type !== newType) {
    if (chartSecondaire) chartSecondaire.destroy();
    chartSecondaire = new Chart(ctx, { type: newType, data, options });
  } else {
    chartSecondaire.data = data;
    chartSecondaire.update();
  }
}

function toggleGraphiqueMode(mode) {
  modeGraphique = mode;
  document.getElementById('btn-mode-a').classList.toggle('active', mode === 'A');
  document.getElementById('btn-mode-b').classList.toggle('active', mode === 'B');
  if (chartSecondaire) { chartSecondaire.destroy(); chartSecondaire = null; }
  onInput();
}
  function renderDonut(res) {
  const ctx = document.getElementById('chart-donut').getContext('2d');
  const pA = lireParams('a');
  const capitalTotal = res.amortissement.reduce((s, r) => s + r.capital, 0);
  const fraisTotal = res.fraisNotaire + pA.fraisDossier + pA.fraisGarantie;

  const data = {
    labels: ['Capital', 'Intérêts', 'Assurance', 'Frais'],
    datasets: [{
      data: [Math.round(capitalTotal), res.interetsTotaux, res.assuranceTotale, Math.round(fraisTotal)],
      backgroundColor: ['#2563eb', '#dc2626', '#f59e0b', '#10b981'],
      borderWidth: 2, borderColor: '#ffffff'
    }]
  };

  const options = {
    responsive: true, maintainAspectRatio: true,
    cutout: '62%',
    plugins: {
      legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },
      tooltip: {
        callbacks: {
          label: c => {
            const total = c.dataset.data.reduce((a, b) => a + b, 0);
            const pct = ((c.parsed / total) * 100).toFixed(1);
            return ` ${c.label} : ${new Intl.NumberFormat('fr-FR').format(c.parsed)} € (${pct} %)`;
          }
        }
      }
    }
  };

  if (!chartDonut) {
    chartDonut = new Chart(ctx, { type: 'doughnut', data, options });
  } else {
    chartDonut.data = data;
    chartDonut.update();
  }
}
  function renderTableau(rows, duree) {}
  function toggleTableauMode(mode) {}
  function toggleScenarioB() {}

  // Init
  onInput();
  </script>
</body>
